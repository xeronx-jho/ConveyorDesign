<title>컨베어 구동부 선정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="컨베어 선정">
<meta name="theme-color" content="#1F4E79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* 레이아웃: 폰은 하단 탭(입력/결과/근거) 전환, 데스크톱은 입력 | 결과 2열. 계산 수치는 모노스페이스. */
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --fg: #1b2430; --muted: #5d6b7c; --line: #d9dee6;
    --accent: #1f4e79; --accent-fg: #ffffff; --accent-soft: #e4ecf5;
    --ok: #1f7a4d; --ok-soft: #e3f3ea; --ng: #b23a2a; --ng-soft: #fbe7e3; --warn-soft: #fff4dc; --warn-fg: #7a4a00; --warn-line: #f0c36a;
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
    --tabbar: 56px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1419; --panel: #1a2029; --fg: #e6ebf1; --muted: #93a0b1; --line: #2b3440;
    --accent: #5b9bd5; --accent-fg: #0f1419; --accent-soft: #1b2b3d;
    --ok: #5fcf8f; --ok-soft: #14301f; --ng: #f08c7c; --ng-soft: #3a1b16; --warn-soft: #3a2c10; --warn-fg: #f3cf84; --warn-line: #7a5a1e;
    color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0f1419; --panel: #1a2029; --fg: #e6ebf1; --muted: #93a0b1; --line: #2b3440;
    --accent: #5b9bd5; --accent-fg: #0f1419; --accent-soft: #1b2b3d;
    --ok: #5fcf8f; --ok-soft: #14301f; --ng: #f08c7c; --ng-soft: #3a1b16; --warn-soft: #3a2c10; --warn-fg: #f3cf84; --warn-line: #7a5a1e;
    color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--accent); color: var(--accent-fg);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header.top .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header.top h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .01em; white-space: nowrap; }
  header.top input { flex: 1 1 140px; min-width: 0; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); border-radius: 8px; padding: 6px 10px; color: inherit; }
  header.top input::placeholder { color: rgba(255,255,255,.6); }
  header.top .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  header.top .tools button { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); color: inherit; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  header.top .tools button:active { background: rgba(255,255,255,.28); }

  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px)); }
  .view { display: none; }
  .view.active { display: block; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--accent); margin: 0 0 8px; text-transform: none; letter-spacing: .02em; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  .seg button { background: var(--panel); border: 0; padding: 9px 4px; font-size: 14px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }

  .field { display: grid; grid-template-columns: minmax(0, 1fr) 118px 58px; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); }
  .field:first-of-type { border-top: 0; }
  .field label { font-size: 14px; min-width: 0; }
  .field label small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.3; }
  .field input[type="text"], .field select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--bg); font-family: var(--mono); font-size: 14px; text-align: right; min-width: 0; }
  .field select { font-family: var(--sans); text-align: left; }
  .field .unit { color: var(--muted); font-size: 12.5px; font-family: var(--mono); }
  .field.wide { grid-template-columns: minmax(0, 1fr) 176px; }
  .field.check { grid-template-columns: minmax(0, 1fr) auto; }
  .field.check input { width: 22px; height: 22px; accent-color: var(--accent); }
  .field.pair { grid-template-columns: minmax(0, 1fr) 80px 80px; }
  .field[hidden] { display: none; }

  /* 결과 */
  .summary { background: var(--accent); color: var(--accent-fg); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .summary .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
  .summary .big { font-size: 26px; font-weight: 700; font-family: var(--mono); line-height: 1.2; margin: 4px 0 8px; }
  .summary .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 14px; }
  .summary .grid div { font-size: 13px; opacity: .9; }
  .summary .grid b { display: block; font-family: var(--mono); font-size: 15px; font-weight: 600; opacity: 1; }
  .warnings { background: var(--warn-soft); border: 1px solid var(--warn-line); color: var(--warn-fg); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 13.5px; }
  .warnings p { margin: 0; } .warnings p + p { margin-top: 6px; }
  .warnings.error { background: var(--ng-soft); border-color: var(--ng); color: var(--ng); }
  .group { margin-bottom: 10px; }
  .group h3 { font-size: 13px; color: var(--accent); margin: 0; padding: 8px 10px; background: var(--accent-soft); border-radius: 8px 8px 0 0; }
  .group table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; overflow: hidden; }
  .group td { padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  .group tr:first-child td { border-top: 0; }
  .group td.item { width: 46%; }
  .group td.val { text-align: right; font-family: var(--mono); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .group td.unit { color: var(--muted); font-family: var(--mono); font-size: 12.5px; white-space: nowrap; width: 1%; }
  .group td.note { display: block; color: var(--muted); font-size: 12.5px; padding-top: 0; border-top: 0; }
  .group tr.key td.val { color: var(--accent); }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.ng { background: var(--ng-soft); color: var(--ng); }

  pre.log { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; white-space: pre; overflow-x: auto; margin: 0; }
  .note { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--panel); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  nav.tabs button { height: var(--tabbar); border: 0; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  nav.tabs button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); font-weight: 600; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 99px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
  .cases { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .cases select { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--panel); }
  .cases button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; font-size: 13px; cursor: pointer; }

  @media (min-width: 960px) {
    :root { --tabbar: 0px; }
    nav.tabs { display: none; }
    main { display: grid; grid-template-columns: 460px minmax(0, 1fr); gap: 16px; align-items: start; max-width: 1400px; margin: 0 auto; }
    .view { display: block; }
    #view-input { grid-row: 1 / span 2; }
    #view-log pre.log { max-height: 60vh; overflow: auto; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<header class="top">
  <div class="row">
    <h1>컨베어 구동부 선정</h1>
    <input id="projectName" type="text" placeholder="프로젝트명" autocomplete="off">
    <div class="tools">
      <button id="btnCopy" type="button">보고서 복사</button>
      <button id="btnReset" type="button">초기화</button>
    </div>
  </div>
</header>

<main>
  <section class="view active" id="view-input" aria-label="입력">
    <div class="cases">
      <select id="caseSelect" aria-label="저장된 케이스"><option value="">저장된 케이스…</option></select>
      <button id="btnSave" type="button">저장</button>
      <button id="btnDelete" type="button">삭제</button>
    </div>
    <div class="seg" id="typeSeg" role="group" aria-label="컨베어 종류">
      <button type="button" data-type="belt">벨트</button>
      <button type="button" data-type="roller">롤러</button>
      <button type="button" data-type="chain">체인</button>
    </div>
    <div id="form"></div>
  </section>

  <section class="view" id="view-result" aria-label="결과">
    <div class="summary" id="summary"></div>
    <div id="warnings"></div>
    <div id="results"></div>
    <p class="note">표준 규격 데이터 기준 계산 결과입니다. 최종 선정은 제조사 카탈로그(허용토크·OHL·허용관성·체인 정격)로 확인하십시오.</p>
  </section>

  <section class="view" id="view-log" aria-label="계산 근거">
    <pre class="log" id="log"></pre>
  </section>
</main>

<nav class="tabs" role="tablist">
  <button type="button" role="tab" data-view="input" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/></svg>입력</button>
  <button type="button" role="tab" data-view="result" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 14l3-3 3 2 4-5"/></svg>결과</button>
  <button type="button" role="tab" data-view="log" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6M9 13h7M9 17h7"/></svg>계산 근거</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>/*ENGINE*/</script>
<script>
(function () {
  'use strict';
  const E = window.ConveyorEngine, D = E.data;
  const $ = s => document.querySelector(s);
  let inp = E.defaults();
  const LS = { current: 'cvd.current', cases: 'cvd.cases', view: 'cvd.view' };
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } };

  const opt = o => Object.entries(o).map(([v, l]) => ({ v, l }));
  const num = a => a.map(v => ({ v: String(v), l: String(v) }));
  const isBelt = i => i.type === 'belt', isRoller = i => i.type === 'roller', isChain = i => i.type === 'chain';
  const isServo = i => i.motorKind === 'servo', isInd = i => i.motorKind === 'induction', isCD = i => i.transmission === 'chain';

  // 입력 스키마 (키는 엔진 입력과 동일)
  const sections = [
    { title: '반송 조건', fields: [
      { k: 'speed', l: '반송 속도 V', u: 'm/min' },
      { k: 'length', l: '컨베어 길이 (축간) L', u: 'm' },
      { k: 'angle', l: '경사각 θ', h: '+상승 / −하강', u: '°' },
      { k: 'workMass', l: '워크 질량 M1', u: 'kg/개' },
      { k: 'workCount', l: '워크 개수 (동시 적재) n1', u: '개', int: true },
      { k: 'accumulation', l: '축적(저류) 운전', h: '워크가 정지한 채 벨트/롤러가 미끄러짐', t: 'check' },
      { k: 'frictionProduct', l: '제품–반송면 마찰계수 μST', u: '0.2~0.5', show: i => i.accumulation },
    ]},
    { title: '벨트 / 풀리', show: isBelt, fields: [
      { k: 'beltKind', l: '벨트 종류', t: 'select', o: opt({ rubber: '고무 / PVC 벨트', modular: '모듈 플라스틱 벨트 (FMS)' }) },
      { k: 'beltWidth', l: '벨트 폭 b0', u: 'mm' },
      { k: 'beltMassPerM2', l: '벨트 단위질량', h: 'PVC 2ply ≈ 3, 고무 ≈ 8~12, 모듈벨트 ≈ 6~10', u: 'kg/m²' },
      { k: 'frictionBelt', l: '벨트–지지면 마찰계수 μT', h: '슬라이더 베드 0.3, 롤러 지지 0.03~0.05', u: '' },
      { k: 'pulleyDiameter', l: '구동 풀리 외경 D1', u: 'mm', list: D.pulleys },
      { k: 'pulleyMass', l: '구동 풀리 질량 mW', u: 'kg' },
      { k: 'wrapAngle', l: '벨트 감김각', u: '°', show: i => i.beltKind === 'rubber' },
      { k: 'frictionPulley', l: '벨트–풀리 마찰계수', h: '맨 강철 0.25~0.3, 고무 라깅 0.35~0.4', u: '', show: i => i.beltKind === 'rubber' },
      { k: 'beltAllowableTension', l: '벨트 허용 장력 (폭당)', h: 'PVC 2ply 6~8, 3ply 10~12', u: 'N/mm', show: i => i.beltKind === 'rubber' },
      { k: 'c1StartStop', l: 'C1 가산: 시작-멈춤 (+0.2)', t: 'check', show: i => i.beltKind === 'modular' },
      { k: 'c1Pushing', l: 'C1 가산: 종동 구동 (+0.2)', h: 'V>30 m/min(+0.2), 상승(+0.4)은 자동', t: 'check', show: i => i.beltKind === 'modular' },
      { k: 'c2Temperature', l: '온도 팩터 C2', h: '20°C 이하 1.0 / PP 60°C 0.85 / POM 80°C 0.75', u: '', show: i => i.beltKind === 'modular' },
      { k: 'c3Max', l: '허용 벨트 장력 C3max', h: 'FMS 시리즈별 데이터시트', u: 'N/mm', show: i => i.beltKind === 'modular' },
    ]},
    { title: '롤러', show: isRoller, fields: [
      { k: 'rollerDiameter', l: '롤러 외경 D1', u: 'mm', list: D.rollers },
      { k: 'rollerPitch', l: '롤러 피치', u: 'mm' },
      { k: 'rollerMass', l: '롤러 질량 (스프라켓 포함) M2', u: 'kg/개' },
      { k: 'rollerShaftDiameter', l: '롤러 축경 (베어링 내경)', u: 'mm' },
      { k: 'frictionRolling', l: '워크–롤러 굴림마찰 μ1', h: '강 롤러 0.03~0.05, 고무 라이닝 0.1', u: '' },
      { k: 'frictionBearing', l: '롤러 베어링 마찰 μ2', u: '0.05~0.1' },
      { k: 'rollerChainMassPerM', l: '롤러 구동 체인 단위질량', h: 'RS40 0.64, RS50 1.04', u: 'kg/m' },
    ]},
    { title: '컨베어 체인 / 스프라켓', show: isChain, fields: [
      { k: 'chainPitch', l: '체인 피치 p', h: 'RS60 19.05, RS80 25.4, RS100 31.75, RS120 38.1, C2080 50.8', u: 'mm', list: [12.7, 15.875, 19.05, 25.4, 31.75, 38.1, 44.45, 50.8, 63.5, 76.2, 101.6] },
      { k: 'chainStrands', l: '체인 열 수', u: '열', int: true },
      { k: 'conveyorSprocketTeeth', l: '구동 스프라켓 잇수 z', u: 'T', int: true, list: D.teeth },
      { k: 'conveyorSprocketMass', l: '스프라켓 질량 M2', u: 'kg/개' },
      { k: 'chainMassPerM', l: '체인 단위질량 (슬랫 포함)', u: 'kg/m·열' },
      { k: 'frictionChain', l: '체인–가이드 마찰계수 μ', h: '롤러체인+강 레일 0.12~0.15, 슬라이딩 0.2~0.3', u: '' },
      { k: 'chainAllowableLoad', l: '체인 최대허용하중', h: '0 = 표준표', u: 'kN' },
    ]},
    { title: '모터 / 감속기 / 전동', fields: [
      { k: 'motorKind', l: '모터 종류', t: 'select', o: opt({ induction: '3상 유도전동기 (+인버터)', servo: 'AC 서보모터' }) },
      { k: 'motorPoles', l: '모터 극수', t: 'select', o: num([2, 4, 6, 8]), int: true, show: isInd },
      { k: 'frequency', l: '전원 주파수', t: 'select', o: num([50, 60]), show: isInd },
      { k: 'motorMargin', l: '모터 용량 여유율', u: '1.1~1.5', show: isInd },
      { k: 'servoRatedRpm', l: '서보 정격 회전수', h: '저관성 3000, 중관성 2000', u: 'rpm', show: isServo },
      { k: 'servoMaxTorqueRatio', l: '최대토크 배율 (최대/정격)', u: '배', show: isServo },
      { k: 'servoMaxInertiaRatio', l: '허용 관성비 (J부하/J모터)', h: '저관성 10~15, 중관성 5~10', u: '배', show: isServo },
      { k: 'servoInertiaAsWarning', l: '관성비 초과 시 경고만', h: '토크 조건으로 선정 (저속 컨베어)', t: 'check', show: isServo },
      { k: 'servoTorqueUtilization', l: '실효토크 사용률', h: '실효토크 ≤ 정격 × 값', u: '', show: isServo },
      { k: 'servoSpeedUtilization', l: '회전수 사용률', h: '최고 회전수 ≤ 정격 × 값', u: '', show: isServo },
      { k: 'moveDistance', l: '1사이클 이동거리', h: '0 = 연속 운전', u: 'mm', show: isServo },
      { k: 'decelTime', l: '감속 시간', u: 's', show: isServo },
      { k: 'dwellTime', l: '정지 시간', u: 's', show: isServo },
      { k: 'reducerEfficiency', l: '감속기 효율 η', h: '헬리컬 0.9~0.95, 웜 0.5~0.8', u: '' },
      { k: 'manualReducerRatio', l: '감속비 1/i', h: '0 = 자동 선정 (서보: 1 = 직결)', u: '', list: [0, 1, 3, 5, 7.5, 10, 15, 20, 25, 30, 40, 50, 60, 80, 100, 120, 150, 200] },
      { k: 'transmission', l: '전동 방식', t: 'select', o: opt({ chain: '스프라켓·체인 전동', direct: '직결 (커플링 / 중공축)' }) },
      { k: 'transmissionEfficiency', l: '전동 체인 효율', u: '0.93~0.97', show: isCD },
      { k: 'autoSelectSprockets', l: '스프라켓 잇수 자동 선정', h: '속도 오차 최소 조합', t: 'check', show: isCD },
      { k: 'driveSprocketTeeth', l: '감속기측 스프라켓 z3', u: 'T', int: true, list: D.teeth, show: i => isCD(i) && !i.autoSelectSprockets },
      { k: 'drivenSprocketTeeth', l: '구동축측 스프라켓 z2', u: 'T', int: true, list: D.teeth, show: i => isCD(i) && !i.autoSelectSprockets },
      { k: 'transmissionCenterDistance', l: '전동 체인 축간거리 C', h: '권장 30~50 피치', u: 'mm', show: isCD },
    ]},
    { title: '운전 조건 (서비스팩터 · 관성 · OHL)', fields: [
      { k: 'loadClass', l: '하중의 정도', t: 'select', o: opt({ uniform: '균일 부하', light: '가벼운 충격 부하', heavy: '무거운 충격 부하' }) },
      { k: 'dailyHours', l: '1일 운전 시간', t: 'select', o: opt({ under3: '3시간 이하', h3to10: '3~10시간', over10: '10시간 이상' }) },
      { k: 'startsPerDay', l: '기동 횟수', h: '70회/일 초과 시 관성 보정계수 증가', u: '회/일', int: true },
      { k: 'accelTime', l: '기동 가속 시간', h: '유도: 인버터 가속시간 / 서보: 0.1~0.5 s', u: 's' },
      { k: 'ohlPosition', l: 'OHL 하중 위치', t: 'select', o: opt({ root: '축의 밑부분 (K2 0.75)', center: '축의 중앙 (K2 1.00)', end: '축단 (K2 1.50)' }) },
    ]},
  ];

  // ───── 폼 생성 (1회) ─────
  const form = $('#form'), fieldEls = [], sectionEls = [];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  for (const sec of sections) {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<h2>${esc(sec.title)}</h2>`;
    for (const fd of sec.fields) {
      const row = document.createElement('div'); const id = 'f_' + fd.k;
      const hint = fd.h ? `<small>${esc(fd.h)}</small>` : '';
      if (fd.t === 'check') {
        row.className = 'field check';
        row.innerHTML = `<label for="${id}">${esc(fd.l)}${hint}</label><input id="${id}" type="checkbox">`;
      } else if (fd.t === 'select') {
        row.className = 'field wide';
        row.innerHTML = `<label for="${id}">${esc(fd.l)}${hint}</label><select id="${id}">${fd.o.map(o => `<option value="${esc(o.v)}">${esc(o.l)}</option>`).join('')}</select>`;
      } else {
        row.className = 'field';
        const list = fd.list ? `<datalist id="${id}_l">${fd.list.map(v => `<option value="${v}">`).join('')}</datalist>` : '';
        row.innerHTML = `<label for="${id}">${esc(fd.l)}${hint}</label><input id="${id}" type="text" inputmode="decimal" autocomplete="off" ${fd.list ? `list="${id}_l"` : ''}><span class="unit">${esc(fd.u || '')}</span>${list}`;
      }
      card.appendChild(row);
      const el = row.querySelector('input, select');
      fieldEls.push({ fd, row, el });
      el.addEventListener(fd.t === 'check' || fd.t === 'select' ? 'change' : 'input', () => onEdit(fd, el));
      if (fd.t !== 'check' && fd.t !== 'select') el.addEventListener('blur', () => { el.value = fmtVal(inp[fd.k]); });
    }
    form.appendChild(card);
    sectionEls.push({ sec, card });
  }
  const fmtVal = v => (v === undefined || v === null) ? '' : String(v);
  let timer = null;
  function onEdit(fd, el) {
    if (fd.t === 'check') inp[fd.k] = el.checked;
    else if (fd.t === 'select') inp[fd.k] = fd.int ? parseInt(el.value, 10) : (isNaN(+el.value) ? el.value : (fd.o.every(o => !isNaN(+o.v)) ? +el.value : el.value));
    else { const v = fd.int ? parseInt(el.value, 10) : parseFloat(el.value); if (isNaN(v)) return; inp[fd.k] = v; }
    clearTimeout(timer); timer = setTimeout(refresh, 120);
  }
  function fillForm() {
    $('#projectName').value = inp.projectName;
    for (const { fd, el } of fieldEls) {
      if (fd.t === 'check') el.checked = !!inp[fd.k]; else el.value = fmtVal(inp[fd.k]);
    }
    updateVisibility();
  }
  function updateVisibility() {
    for (const { sec, card } of sectionEls) card.hidden = sec.show ? !sec.show(inp) : false;
    for (const { fd, row } of fieldEls) row.hidden = fd.show ? !fd.show(inp) : false;
    for (const b of $('#typeSeg').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.type === inp.type));
  }
  $('#typeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; inp.type = b.dataset.type; refresh(); });
  $('#projectName').addEventListener('input', e => { inp.projectName = e.target.value; lsSet(LS.current, inp); });

  // ───── 계산 및 결과 렌더 ─────
  const groupNames = { load: '1. 부하', shaft: '2. 구동축', motor: '3. 모터', reducer: '4. 감속기', sprocket: '5. 스프라켓 / 전동체인', check: '6. 검토' };
  let last = null;
  function refresh() {
    updateVisibility();
    last = E.calculate(inp);
    lsSet(LS.current, inp);
    renderSummary(last); renderWarnings(last); renderRows(last);
    $('#log').textContent = last.log;
  }
  function renderSummary(r) {
    const s = $('#summary');
    if (!r.ok) { s.innerHTML = `<div class="eyebrow">선정 요약</div><div class="big">계산 실패</div><div>입력값을 확인하십시오.</div>`; return; }
    const m = r.summary, kw = m.servo ? (m.kw < 1 ? `${m.kw * 1000} W 서보` : `${m.kw} kW 서보`) : `${m.kw} kW ${m.poles}P`;
    const ratio = m.ratio === 1 ? '직결' : `1/${E.fmt(m.ratio, 1)}`;
    s.innerHTML = `<div class="eyebrow">${esc(inp.projectName || '컨베어')} · ${esc(E.typeName(inp))}</div>
      <div class="big">${esc(kw)} · 감속비 ${esc(ratio)}</div>
      <div class="grid">
        <div>감속기 출력<b>${E.fmt(m.nOut, 1)} rpm · ${E.fmt(m.tOut, 1)} N·m</b></div>
        ${m.chain ? `<div>스프라켓 / 체인<b>${m.z3}T → ${m.z2}T · ${esc(m.chain.chain)} ${m.chain.links}L</b></div>` : '<div>전동<b>직결</b></div>'}
        <div>${m.servo ? '최고속도' : '실제 속도'}<b>${E.fmt(m.vAct, 1)} m/min${m.servo ? '' : ` (${(m.err >= 0 ? '+' : '') + E.fmt(m.err, 1)} %)`}</b></div>
        <div>모터 회전수<b>${E.fmt(m.rpm, 0)} rpm</b></div>
      </div>`;
  }
  function renderWarnings(r) {
    const w = $('#warnings');
    if (!r.warnings.length) { w.innerHTML = ''; return; }
    w.innerHTML = `<div class="warnings${r.ok ? '' : ' error'}">${r.warnings.map(x => `<p>⚠ ${esc(x)}</p>`).join('')}</div>`;
  }
  function renderRows(r) {
    const groups = {};
    for (const row of r.rows) (groups[row.g] = groups[row.g] || []).push(row);
    $('#results').innerHTML = Object.keys(groupNames).filter(g => groups[g]).map(g => `
      <div class="group"><h3>${groupNames[g]}</h3><table>${groups[g].map(x => `
        <tr class="${x.tag === 'key' ? 'key' : ''}"><td class="item">${esc(x.item)}</td><td class="val">${esc(x.value)}${x.tag === 'ok' || x.tag === 'ng' ? `<span class="tag ${x.tag}">${x.tag.toUpperCase()}</span>` : ''}</td><td class="unit">${esc(x.unit)}</td></tr>
        ${x.note ? `<tr><td class="note" colspan="3">${esc(x.note)}</td></tr>` : ''}`).join('')}</table></div>`).join('');
  }

  // ───── 탭 ─────
  function showView(v) {
    for (const s of document.querySelectorAll('.view')) s.classList.toggle('active', s.id === 'view-' + v);
    for (const b of document.querySelectorAll('nav.tabs button')) b.setAttribute('aria-selected', String(b.dataset.view === v));
    lsSet(LS.view, v); window.scrollTo({ top: 0 });
  }
  document.querySelector('nav.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showView(b.dataset.view); });

  // ───── 케이스 저장 / 불러오기 ─────
  function loadCases() { return lsGet(LS.cases, []); }
  function renderCases(sel) {
    const c = loadCases(), s = $('#caseSelect');
    s.innerHTML = '<option value="">저장된 케이스…</option>' + c.map((x, i) => `<option value="${i}">${esc(x.name)} (${esc(x.savedAt)})</option>`).join('');
    if (sel !== undefined) s.value = String(sel);
  }
  $('#btnSave').addEventListener('click', () => {
    const c = loadCases(), name = inp.projectName || '컨베어';
    const idx = c.findIndex(x => x.name === name), rec = { name, savedAt: new Date().toLocaleDateString('ko-KR'), input: inp };
    if (idx >= 0) c[idx] = rec; else c.push(rec);
    lsSet(LS.cases, c); renderCases(idx >= 0 ? idx : c.length - 1); toast(`"${name}" 저장됨 (이 기기 브라우저에 보관)`);
  });
  $('#caseSelect').addEventListener('change', e => {
    const c = loadCases(), x = c[+e.target.value]; if (!x) return;
    inp = Object.assign(E.defaults(), x.input); fillForm(); refresh(); toast(`"${x.name}" 불러옴`);
  });
  $('#btnDelete').addEventListener('click', () => {
    const s = $('#caseSelect'); if (s.value === '') { toast('삭제할 케이스를 먼저 선택하십시오'); return; }
    const c = loadCases(); const [x] = c.splice(+s.value, 1); lsSet(LS.cases, c); renderCases(); toast(`"${x.name}" 삭제됨`);
  });
  $('#btnReset').addEventListener('click', () => { inp = E.defaults(); fillForm(); refresh(); toast('기본값으로 초기화'); });

  // ───── 보고서 복사 ─────
  function report() {
    const r = last, lines = [];
    lines.push('컨베어 구동부 선정 보고서');
    lines.push(`프로젝트: ${inp.projectName}   종류: ${E.typeName(inp)}   작성: ${new Date().toLocaleString('ko-KR')}`);
    lines.push('='.repeat(70));
    lines.push('[선정 요약]  ' + $('#summary').innerText.replace(/\s+/g, ' ').trim());
    lines.push(''); lines.push('[선정 사양]');
    let g = '';
    for (const x of r.rows) { if (x.g !== g) { g = x.g; lines.push(''); lines.push('  ' + groupNames[g]); } lines.push(`    ${x.item.padEnd(26)} ${String(x.value).padStart(14)} ${x.unit.padEnd(7)} ${x.note}`); }
    if (r.warnings.length) { lines.push(''); lines.push('[검토 사항]'); for (const w of r.warnings) lines.push('  ⚠ ' + w); }
    lines.push(''); lines.push('='.repeat(70)); lines.push(r.log);
    lines.push(''); lines.push('※ 표준 규격 데이터 기준 계산 결과. 최종 선정은 제조사 카탈로그로 확인할 것.');
    return lines.join('\n');
  }
  $('#btnCopy').addEventListener('click', () => {
    const t = report();
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('보고서를 복사했습니다'); } catch { toast('복사 실패 — 계산 근거 탭에서 직접 선택하십시오'); } ta.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('보고서를 복사했습니다')).catch(fallback); else fallback();
  });
  let toastTimer; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800); }

  // ───── 시작 ─────
  inp = Object.assign(E.defaults(), lsGet(LS.current, {}));
  renderCases(); fillForm(); refresh();
  const v = lsGet(LS.view, 'input'); if (v !== 'input') showView(v);
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai$/.test(location.hostname)) { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch { } }
})();
</script>
